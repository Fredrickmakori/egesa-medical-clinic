# Nginx configuration for Egesa Medical Clinic web platform
# Place this in your nginx server block or include it

server {
    listen 80;
    server_name your-domain.com;

    # Root directory where WASM bundle is deployed
    root /var/www/egesa-medical-clinic;

    # Use index.html as default
    index index.html;

    # ========================================
    # MIME Types Configuration
    # ========================================

    types {
        # WebAssembly
        application/wasm wasm;

        # JavaScript
        application/javascript js mjs;

        # Default types
        text/html html htm;
        text/css css;
        image/svg+xml svg;
        application/json json;
        application/font woff woff2;
        image/x-icon ico;
    }

    # ========================================
    # Response Headers
    # ========================================

    # Enable CORS for shared resources
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    # Security headers
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'X-Frame-Options' 'SAMEORIGIN' always;
    add_header 'X-XSS-Protection' '1; mode=block' always;

    # ========================================
    # Caching Configuration
    # ========================================

    # Cache WASM and JS bundles aggressively (they are versioned)
    location ~* \.(js|wasm|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other assets for 30 days
    location ~* \.(css|svg|png|jpg|jpeg|gif|ico|font|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Don't cache HTML
    location ~ \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ========================================
    # SPA Routing
    # ========================================

    # Route all unmatched requests to index.html for SPA
    location / {
        # Don't cache index.html
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Try to serve file directly
        try_files $uri /index.html;
    }

    # ========================================
    # Gzip Compression
    # ========================================

    gzip on;
    gzip_types text/plain text/html text/css text/xml text/javascript
               application/xml application/javascript application/json
               application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Note: Don't gzip .wasm files - they're already compressed
    gzip_disable "\.wasm$";

    # ========================================
    # Security
    # ========================================

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }

    # ========================================
    # Performance Tuning
    # ========================================

    # Enable sendfile and tcp_nopush
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive timeout
    keepalive_timeout 65;

    # ========================================
    # SSL/TLS (optional but recommended)
    # ========================================

    # Uncomment and configure for HTTPS
    # listen 443 ssl http2;
    # ssl_certificate /path/to/certificate.crt;
    # ssl_certificate_key /path/to/private.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
}

